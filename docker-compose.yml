services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: nss_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # MS SQL Server — point to your actual SQL Server host/instance
      # For Windows Auth inside Docker you need domain/NTLM; use SQL auth here:
      - DB_SERVER=${DB_SERVER:-host.docker.internal\SQLEXPRESS}
      - DB_DATABASE=${DB_DATABASE:-nss_db}
      - DB_TRUSTED_CONNECTION=false
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:-dummy_secret_for_docker}
      - RESEND_API_KEY=${RESEND_API_KEY}
    volumes:
      - server_uploads:/app/uploads
    extra_hosts:
      # Allow the container to reach the host machine's SQL Server
      - "host.docker.internal:host-gateway"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: nss_client
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  server_uploads:
